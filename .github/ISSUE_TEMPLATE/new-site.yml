name: 新站点请求
description: 希望支持一个新的网站
title: "[新站点] "
labels: ["新站点"]
body:
  - type: markdown
    attributes:
      value: |
        本项目面向开发者控制台、后台面板这类站点。请先确认该站点**官方没有中文界面**，或官方的中文界面不完整。
  - type: input
    id: site
    attributes:
      label: 站点名称与网址
      description: 例如 OpenRouter，https://openrouter.ai
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: 要汉化的页面是否需要登录
      options:
        - 不需要
        - 需要登录
        - 需要登录并且有付费或特定数据才能看到
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 希望覆盖的页面
      description: 例如「登录后的账户设置、密钥、账单、用量」。越具体越好
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: 你能帮什么忙
      options:
        - 只是提需求
        - 愿意帮忙测试
        - 愿意参与翻译或审校
        - 愿意自己写脚本
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我确认该站点官方没有中文界面，或中文界面不完整
          required: true
        - label: 我已经搜索过现有 Issue，没有重复的请求
          required: true
